/* ===================== FUNCIONAMENTO (não precisa mexer) ===================== */
const categorias = [...new Set(produtos.map(p => p.categoria))];
let catAtual = "Todos", termo = "";
const $ = id => document.getElementById(id);

function card(p) {
  return `<div class="bg-white rounded-xl shadow-sm overflow-hidden flex flex-col">
    <img src="${p.foto}" alt="${p.nome}" loading="lazy" class="w-full aspect-square object-cover bg-gray-100">
    <div class="p-2 flex flex-col flex-1">
      <h3 class="text-sm leading-snug min-h-[2.5rem]">${p.nome}</h3>
      <p class="text-lg font-extrabold text-orange-500 mt-1">${p.preco}</p>
      <a href="${p.link}" target="_blank" rel="noopener sponsored"
         class="mt-2 block text-center bg-orange-500 hover:bg-orange-600 text-white text-sm font-bold py-2 rounded-lg">Ver na Shopee</a>
    </div></div>`;
}
const grade = lista => `<div class="grid grid-cols-2 md:grid-cols-4 gap-3">${lista.map(card).join("")}</div>`;

function chips() {
  $("chips").innerHTML = ["Todos", ...categorias].map(c =>
    `<button data-cat="${c}" class="shrink-0 px-4 py-1.5 rounded-full text-sm font-semibold border ${c === catAtual ? "bg-orange-500 text-white border-orange-500" : "bg-white text-gray-600 border-gray-300"}">${c}</button>`
  ).join("");
}

function irPara(cat) {
  catAtual = cat; chips(); render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function render() {
  const el = $("conteudo");
  const buscando = termo.trim() !== "";
  $("banners").style.display = (catAtual === "Todos" && !buscando) ? "block" : "none";

  if (buscando) {
    const t = termo.trim().toLowerCase();
    const achados = produtos.filter(p => p.nome.toLowerCase().includes(t) && (catAtual === "Todos" || p.categoria === catAtual));
    el.innerHTML = achados.length ? grade(achados) : `<p class="text-center text-gray-500 py-16">Nenhum produto encontrado 😕</p>`;
    return;
  }
  if (catAtual === "Todos") {
    el.innerHTML = categorias.map(c => `
      <section class="mb-8">
        <h2 class="text-lg font-extrabold mb-3 border-l-4 border-orange-500 pl-2">${c}</h2>
        ${grade(produtos.filter(p => p.categoria === c).slice(0, 4))}
        <button data-cat="${c}" class="mt-3 w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl shadow">Ver mais produtos de ${c} →</button>
      </section>`).join("");
  } else {
    el.innerHTML = `
      <button data-cat="Todos" class="mb-3 bg-white border border-orange-500 text-orange-500 font-bold px-4 py-2 rounded-full text-sm">← Voltar para Todos</button>
      <h2 class="text-lg font-extrabold mb-3 border-l-4 border-orange-500 pl-2">${catAtual}</h2>
      ${grade(produtos.filter(p => p.categoria === catAtual))}`;
  }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-cat]");
  if (b) irPara(b.dataset.cat);
});
$("busca").addEventListener("input", e => { termo = e.target.value; render(); });

/* Carrossel das 5 imagens do início */
$("slides").innerHTML = banners.map(b =>
  `<a href="${b.link}" target="_blank" rel="noopener sponsored"><img src="${b.foto}" alt="Banner" class="w-full aspect-[2/1] object-cover"></a>`).join("");
$("dots").innerHTML = banners.map(() => `<span class="w-2 h-2 rounded-full bg-gray-300"></span>`).join("");
let slideAtual = 0;
function marcarDots() {
  [...$("dots").children].forEach((d, i) => d.className = `w-2 h-2 rounded-full ${i === slideAtual ? "bg-orange-500" : "bg-gray-300"}`);
}
$("slides").addEventListener("scroll", () => {
  slideAtual = Math.round($("slides").scrollLeft / $("slides").clientWidth); marcarDots();
});
setInterval(() => {
  const s = $("slides");
  slideAtual = (slideAtual + 1) % banners.length;
  s.scrollTo({ left: slideAtual * s.clientWidth, behavior: "smooth" });
}, 4000);
marcarDots();

chips(); render();
</script>
